<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাপ দিন — সেলাই ঘর দেবিদ্বার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#2B2320; --ink-soft:#8B7A78;
    --wine:#7A2142; --wine-deep:#5C1832; --gold:#C08A3E;
    --blush:#F8EDE9; --white:#FFFFFF; --line:#EAE0DC; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Hind Siliguri',sans-serif; color:var(--ink); background:var(--white); line-height:1.7; font-size:17px; padding-bottom:40px; }
  h1,h2,.brand-name{ font-family:'Tiro Bangla',serif; }

  header{
    display:flex; align-items:center; gap:10px; padding:16px 20px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(255,255,255,.97); z-index:20;
  }
  header a{ color:var(--wine-deep); font-size:20px; text-decoration:none; }
  .brand-name{ font-size:17px; color:var(--wine-deep); }

  .progress{ display:flex; gap:6px; padding:16px 20px 0; max-width:560px; margin:0 auto; }
  .progress div{ flex:1; height:5px; border-radius:99px; background:var(--line); }
  .progress div.done{ background:var(--wine); }

  main{ max-width:560px; margin:0 auto; padding:20px; }
  .step{ display:none; }
  .step.active{ display:block; animation:fade .2s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .step h2{ font-size:20px; color:var(--wine-deep); margin-bottom:4px; }
  .step .sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:18px; }

  .field{ margin-bottom:18px; }
  .field label{ display:flex; align-items:center; gap:6px; font-size:14.5px; font-weight:600; margin-bottom:8px; }
  .field .helpbtn{
    width:20px;height:20px;border-radius:50%;border:1px solid var(--gold); color:var(--gold);
    background:none; font-size:12px; cursor:pointer; line-height:1; flex:0 0 20px;
  }
  .numrow{ display:flex; align-items:center; gap:10px; }
  .numrow button{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    flex:0 0 46px; width:46px; height:46px; align-self:center;
    border-radius:10px; border:1.5px solid var(--line);
    background:var(--white); font-size:22px; line-height:1; cursor:pointer; color:var(--wine);
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .numrow input{
    flex:1; text-align:center; font-size:22px; font-weight:600; padding:12px; border-radius:10px;
    border:1.5px solid var(--line); font-family:inherit;
  }
  .help-diagram{
    display:none; margin-top:10px; padding:10px 12px; background:var(--blush);
    border-radius:10px; font-size:13px; color:var(--ink);
  }
  .help-diagram.open{ display:block; }

  .card-picker{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-bottom:10px; }
  .pick{
    border:2px solid var(--line); border-radius:12px; padding:8px; text-align:center;
    cursor:pointer; font-size:12.5px; background:var(--white);
  }
  .pick img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; margin-bottom:6px; background:var(--blush); }
  .pick.selected{ border-color:var(--wine); background:var(--blush); font-weight:600; color:var(--wine-deep); }
  .custom-text{
    width:100%; padding:11px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:14px; margin-top:6px;
  }
  .empty-note{ font-size:13px; color:var(--ink-soft); padding:10px 0; }

  input[type=text], input[type=tel], textarea, select{
    width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:14.5px;
  }
  textarea{ resize:vertical; min-height:70px; }

  .nav-row{ display:flex; gap:10px; margin-top:26px; }
  .btn{
    flex:1; padding:14px; border-radius:12px; border:none; font-size:15.5px;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-primary{ background:var(--wine); color:var(--white); }
  .btn-primary:hover{ background:var(--wine-deep); }
  .btn-ghost{ background:var(--white); border:1.5px solid var(--line); color:var(--ink); }

  .review-box{ background:var(--blush); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:15.5px; }
  .review-box div{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); }
  .review-box div:last-child{ border:none; }
  .pay-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--blush); border-radius:12px; margin-bottom:16px; }
  .pay-row .amount{ font-weight:700; color:var(--wine); font-size:22px; }

  .radio-opts{ display:flex; gap:10px; }
  .radio-opt{ flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px; text-align:center; cursor:pointer; font-size:14px; }
  .radio-opt.selected{ border-color:var(--wine); background:var(--blush); font-weight:600; color:var(--wine-deep); }

  .success{ text-align:center; padding:40px 10px; }
  .success .tick{ font-size:52px; color:var(--wine); margin-bottom:10px; }
  .order-code{ font-family:'Tiro Bangla',serif; font-size:22px; color:var(--wine-deep); margin:10px 0; }

  /* ভিডিও পপআপ */
  .video-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.85);
    display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
  }
  .video-overlay.open{ display:flex; }
  .video-box{ width:100%; max-width:360px; }
  .video-box iframe{ width:100%; aspect-ratio:9/16; max-height:80vh; border-radius:14px; border:none; }
  .video-close{
    display:block; margin:0 auto 12px; width:38px; height:38px; border-radius:50%;
    border:none; background:var(--white); font-size:18px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <a href="index.html">←</a>
  <span class="brand-name">মাপ দিন</span>
</header>

<div class="progress" id="progress"></div>

<main>
  <div id="dynamicSteps"></div>

  <!-- তথ্য ও রিভিউ (সব ক্যাটাগরির জন্য কমন) -->
  <section class="step" data-step="info">
    <h2>আপনার তথ্য</h2>
    <p class="sub">অর্ডার পাঠাতে নিচের তথ্যগুলো দিন।</p>

    <div class="field">
      <label>আপনার নাম</label>
      <input type="text" id="custName" placeholder="পুরো নাম লিখুন">
    </div>
    <div class="field">
      <label>মোবাইল নম্বর</label>
      <input type="tel" id="custPhone" placeholder="01XXXXXXXXX">
    </div>
    <div class="field">
      <label>সম্পূর্ণ ঠিকানা</label>
      <textarea id="custAddress" placeholder="গ্রাম, ইউনিয়ন, উপজেলা"></textarea>
    </div>

    <div class="field">
      <label>পেমেন্ট পদ্ধতি</label>
      <div class="radio-opts">
        <div class="radio-opt selected" data-val="bkash" onclick="selectPay(this)">বিকাশ (অগ্রিম)</div>
        <div class="radio-opt" data-val="cod" onclick="selectPay(this)">ক্যাশ অন ডেলিভারি</div>
      </div>
    </div>

    <div class="field" id="bkashField">
      <label>বিকাশ ট্রানজেকশন আইডি</label>
      <input type="text" id="bkashTxn" placeholder="TXN আইডি লিখুন">
    </div>

    <div class="review-box" id="reviewBox"></div>

    <div class="pay-row">
      <span>মোট মূল্য (৩০% অগ্রিম)</span>
      <span class="amount" id="advanceAmount">৳0</span>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goToPrev('info')">আগের ধাপ</button>
      <button class="btn btn-primary" onclick="submitOrder()">অর্ডার নিশ্চিত করুন</button>
    </div>
  </section>

  <!-- সফল -->
  <section class="step" data-step="success">
    <div class="success">
      <div class="tick">✓</div>
      <h2>অর্ডার সফলভাবে জমা হয়েছে</h2>
      <div class="order-code" id="orderCodeOut"></div>
      <p class="sub">মাপ নিশ্চিত করতে আমাদের প্রতিনিধি শীঘ্রই আপনাকে ফোন করবে।</p>
      <div class="nav-row"><a class="btn btn-ghost" href="order-tracking.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">অর্ডার ট্র্যাক করুন</a></div>
      <div class="nav-row"><a class="btn btn-primary" href="index.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">হোমপেজে ফিরে যান</a></div>
    </div>
  </section>
</main>

<div class="video-overlay" id="videoOverlay">
  <div class="video-box">
    <button class="video-close" onclick="closeVideo()">✕</button>
    <div id="videoFrameWrap"></div>
  </div>
</div>

        {id:'borkaLength', label:'বোরকার লম্বা', placeholder:56, help:'কাঁধ থেকে গোড়ালি পর্যন্ত (আপনার পছন্দমতো লম্বা) মাপুন।'},
        {id:'sleeveLength', label:'হাতার লম্বা', placeholder:22, help:'কাঁধ থেকে কব্জি পর্যন্ত মাপুন।'},
        {id:'armhole', label:'হাতার ঘের', placeholder:16, help:'বাহুমূল ঘুরিয়ে মাপুন।'}
      ]},
      { title:'হিজাব অপশন', sub:'',
        stylePicker:{ id:'hijabOption', label:'হিজাব/খিমার সংযুক্ত থাকবে কিনা', options:['হিজাব সহ সংযুক্ত','আলাদা হিজাব লাগবে না'] },
        fields:[]
      }
    ],
    designPickers: []
  },

  'পর্দা': {
    steps: [
      { title:'জানালা/দরজার মাপ', sub:'পর্দা বানাতে জানালা বা দরজার সঠিক মাপ দিন।', fields:[
        {id:'width', label:'প্রস্থ (Width)', placeholder:48, help:'জানালা/দরজার একদম বাইরের কানা থেকে কানা পর্যন্ত প্রস্থ মাপুন।'},
        {id:'height', label:'উচ্চতা (Height)', placeholder:60, help:'উপর থেকে নিচ পর্যন্ত উচ্চতা মাপুন।'},
        {id:'panelCount', label:'পর্দার সংখ্যা', placeholder:2, help:'একটা জানালায় সাধারণত ২টা পর্দা লাগে।'}
      ]}

const SUPABASE_URL = 'https://dyirxnzbnwmbaoaecgcq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6KCTdCz0orLYFaufqWuNgA_yrTiDU3N';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const fabricId = params.get('fabric') || '';
const fabricName = params.get('name') || 'নির্বাচিত কাপড়';
const category = params.get('category') || 'থ্রি-পিস';
const price = Number(params.get('price') || 0);

const schema = CATEGORY_SCHEMAS[category] || CATEGORY_SCHEMAS['থ্রি-পিস'];
const stylePickerSelections = {};   // salwarStyle ইত্যাদি
const designPickerSelections = {};  // neck, sleeve ইত্যাদি

let stepOrder = [];       // ['0','1',...,'style'?,'info']
let currentIndex = 0;

function playVideo(url){
  let vid = '';
  const shortsMatch = url.match(/shorts\/([a-zA-Z0-9_-]+)/);
  const watchMatch = url.match(/[?&]v=([a-zA-Z0-9_-]+)/);
  const beMatch = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
  if(shortsMatch) vid = shortsMatch[1];
  else if(watchMatch) vid = watchMatch[1];
  else if(beMatch) vid = beMatch[1];
  if(!vid) return;
  document.getElementById('videoFrameWrap').innerHTML =
    `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  document.getElementById('videoOverlay').classList.add('open');
}
function closeVideo(){
  document.getElementById('videoFrameWrap').innerHTML = '';
  document.getElementById('videoOverlay').classList.remove('open');
}
document.getElementById('videoOverlay').addEventListener('click', e => {
  if(e.target.id === 'videoOverlay') closeVideo();
});

function toLatinDigits(str){
  const bn = '০১২৩৪৫৬৭৮৯';
  return String(str).replace(/[০-৯]/g, d => bn.indexOf(d));
}

function buildSteps(){
  const container = document.getElementById('dynamicSteps');
  let html = '';

  schema.steps.forEach((st, si) => {
    stepOrder.push(String(si));
    html += `<section class="step" data-step="${si}"><h2>${st.title}</h2>`;
    if(st.sub) html += `<p class="sub">${st.sub}</p>`;

    if(st.stylePicker){
      html += `<div class="field"><label>${st.stylePicker.label}</label><div class="card-picker" id="stylePicker_${st.stylePicker.id}"></div></div>`;
    }

    st.fields.forEach(f => {
      html += `
        <div class="field">
          <label>${f.label}
            <button class="helpbtn" onclick="toggleHelp(this)">?</button>
            ${f.videoUrl ? `<button type="button" class="helpbtn" onclick="playVideo('${f.videoUrl}')" style="display:inline-flex;align-items:center;justify-content:center;">▶</button>` : ''}
          </label>
          <div class="numrow">
            <button onclick="stepVal(this,-1)">−</button>
            <input type="text" class="measure-input" id="${f.id}" placeholder="${f.placeholder}" inputmode="decimal">
            <button onclick="stepVal(this,1)">+</button>
          </div>
          <div class="help-diagram">${f.help}</div>
        </div>`;
    });

    html += `<div class="nav-row">`;
    html += si > 0 ? `<button class="btn btn-ghost" onclick="goToPrev('${si}')">আগের ধাপ</button>` : '';
    html += `<button class="btn btn-primary" onclick="goToNext('${si}')">পরবর্তী ধাপ</button>`;
    html += `</div></section>`;
  });

  if(schema.designPickers.length){
    stepOrder.push('style');
    html += `<section class="step" data-step="style"><h2>ডিজাইন পছন্দ</h2><p class="sub">পছন্দের ডিজাইনে ট্যাপ করুন, অথবা নিজে লিখে দিন।</p>`;
    schema.designPickers.forEach(dp => {
      html += `
        <div class="field">
          <label>${dp.label}</label>
          <div class="card-picker" id="designPicker_${dp.id}"><div class="empty-note">ডিজাইন লোড হচ্ছে…</div></div>
          <input type="text" class="custom-text" id="designCustom_${dp.id}" placeholder="আপনার পছন্দের ${dp.label} লিখুন (ঐচ্ছিক)">
        </div>`;
    });
    html += `<div class="nav-row"><button class="btn btn-ghost" onclick="goToPrev('style')">আগের ধাপ</button><button class="btn btn-primary" onclick="goToNext('style')">পরবর্তী ধাপ</button></div></section>`;
  }

  stepOrder.push('info');
  container.innerHTML = html;
}

function renderProgress(){
  const el = document.getElementById('progress');
  el.innerHTML = '';
  const total = stepOrder.length;
  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    if(i <= currentIndex) d.className = 'done';
    el.appendChild(d);
  }
}

function goToStepKey(key){
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.querySelector(`.step[data-step="${key}"]`).classList.add('active');
  currentIndex = stepOrder.indexOf(key);
  renderProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  if(key === 'info') renderReview();
}
function goToNext(fromKey){
  const idx = stepOrder.indexOf(fromKey);
  goToStepKey(stepOrder[idx+1]);
}
function goToPrev(fromKey){
  const idx = stepOrder.indexOf(fromKey);
  goToStepKey(stepOrder[idx-1]);
}

function toggleHelp(btn){
  const box = btn.closest('.field').querySelector('.help-diagram');
  box.classList.toggle('open');
}
function stepVal(btn, dir){
  const input = btn.parentElement.querySelector('input');
  const cur = parseFloat(toLatinDigits(input.value)) || 0;
  input.value = Math.max(0, cur + dir);
}
function sanitizeMeasureInputs(){
  document.querySelectorAll('.measure-input').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.value = toLatinDigits(inp.value).replace(/[^0-9.]/g, '');
    });
  });
}

function renderStylePickers(){
  schema.steps.forEach(st => {
    if(!st.stylePicker) return;
    const sp = st.stylePicker;
    if(!(sp.id in stylePickerSelections)) stylePickerSelections[sp.id] = sp.options[0];
    const el = document.getElementById('stylePicker_'+sp.id);
    function render(){
      el.innerHTML = '';
      sp.options.forEach(opt => {
        const d = document.createElement('div');
        d.className = 'pick' + (opt === stylePickerSelections[sp.id] ? ' selected' : '');
        d.textContent = opt;
        d.onclick = () => { stylePickerSelections[sp.id] = opt; render(); };
        el.appendChild(d);
      });
    }
    render();
  });
}

async function loadDesignPickers(){
  for(const dp of schema.designPickers){
    const el = document.getElementById('designPicker_'+dp.id);
    try{
      const { data, error } = await sb.from(dp.table).select('*').eq('active', true);
      if(error || !data || !data.length){
        el.innerHTML = '<div class="empty-note">এখনো কোনো নমুনা ডিজাইন যোগ করা হয়নি — নিচে লিখে দিন আপনি কেমন চান।</div>';
        continue;
      }
      el.innerHTML = '';
      data.forEach(d => {
        const card = document.createElement('div');
        card.className = 'pick';
        card.innerHTML = `<img src="${d.image_url}" alt="${d.name}"><span>${d.name}</span>`;
        card.onclick = () => {
          el.querySelectorAll('.pick').forEach(p => p.classList.remove('selected'));
          card.classList.add('selected');
          designPickerSelections[dp.id] = d.name;
        };
        el.appendChild(card);
      });
    }catch(e){
      el.innerHTML = '<div class="empty-note">এখনো কোনো নমুনা ডিজাইন যোগ করা হয়নি — নিচে লিখে দিন আপনি কেমন চান।</div>';
    }
  }
}

function selectPay(el){
  document.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  window.payMethod = el.dataset.val;
  document.getElementById('bkashField').style.display = window.payMethod === 'bkash' ? 'block' : 'none';
  renderReview();
}

function renderReview(){
  const advance = Math.round(price * 0.3);
  document.getElementById('advanceAmount').textContent = '৳' + advance;
  const box = document.getElementById('reviewBox');
  box.innerHTML = `
    <div><span>পণ্য</span><span>${fabricName}</span></div>
    <div><span>ক্যাটাগরি</span><span>${category}</span></div>
    <div><span>মোট মূল্য</span><span>৳${price}</span></div>
    <div><span>পেমেন্ট</span><span>${(window.payMethod||'bkash') === 'bkash' ? 'বিকাশ (অগ্রিম)' : 'ক্যাশ অন ডেলিভারি'}</span></div>
  `;
}

async function submitOrder(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  if(!name || !phone || !address){
    alert('অনুগ্রহ করে নাম, মোবাইল নম্বর ও ঠিকানা পূরণ করুন।');
    return;
  }
  const payMethod = window.payMethod || 'bkash';
  if(payMethod === 'bkash' && !document.getElementById('bkashTxn').value.trim()){
    alert('বিকাশ ট্রানজেকশন আইডি দিন।');
    return;
  }

  // সব মাপ জড়ো করা (ক্যাটাগরি অনুযায়ী ফিল্ড ভিন্ন হতে পারে)
  const measurements = {};
  schema.steps.forEach(st => st.fields.forEach(f => {
    const val = parseFloat(toLatinDigits(document.getElementById(f.id).value));
    measurements[f.id] = isNaN(val) ? null : val;
  }));

  // স্টাইল পছন্দ জড়ো করা
  const styleChoices = { ...stylePickerSelections };
  schema.designPickers.forEach(dp => {
    const custom = document.getElementById('designCustom_'+dp.id).value.trim();
    styleChoices[dp.id] = designPickerSelections[dp.id] || custom || null;
  });

  const orderCode = 'SGD-' + Date.now().toString().slice(-8);
  const advance = Math.round(price * 0.3);

  const payload = {
    order_code: orderCode,
    fabric_id: fabricId,
    fabric_name: fabricName,
    category: category,
    customer_name: name,
    customer_phone: phone,
    customer_address: address,
    measurements: measurements,
    style_choices: styleChoices,
    total_price: price,
    advance_amount: advance,
    payment_method: payMethod,
    bkash_txn_id: payMethod === 'bkash' ? document.getElementById('bkashTxn').value.trim() : null,
    status: 'pending'
  };

  const btn = event.target;
  btn.disabled = true; btn.textContent = 'পাঠানো হচ্ছে...';

  const { error } = await sb.from('orders').insert(payload);

  if(error){
    alert('দুঃখিত, অর্ডার পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
    btn.disabled = false; btn.textContent = 'অর্ডার নিশ্চিত করুন';
    console.error(error);
    return;
  }

  document.getElementById('orderCodeOut').textContent = orderCode;
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.querySelector('.step[data-step="success"]').classList.add('active');
  document.getElementById('progress').style.display = 'none';
}

// ইনিট
buildSteps();
document.querySelector(`.step[data-step="${stepOrder[0]}"]`).classList.add('active');
renderProgress();
renderStylePickers();
sanitizeMeasureInputs();
loadDesignPickers();
window.payMethod = 'bkash';
</script>
