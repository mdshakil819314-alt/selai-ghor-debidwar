<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অর্ডার ট্র্যাক করুন — সেলাই ঘর দেবিদ্বার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#2B2320; --ink-soft:#8B7A78;
    --wine:#7A2142; --wine-deep:#5C1832; --gold:#C08A3E;
    --blush:#F8EDE9; --white:#FFFFFF; --line:#EAE0DC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Hind Siliguri',sans-serif; color:var(--ink); background:var(--white); line-height:1.7; font-size:17px; }
  h1,h2,.brand-name{ font-family:'Tiro Bangla',serif; }
  header{
    display:flex; align-items:center; gap:10px; padding:16px 20px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(255,255,255,.97); z-index:10;
  }
  header a{ color:var(--wine-deep); font-size:20px; text-decoration:none; }
  .brand-name{ font-size:17px; color:var(--wine-deep); }
  main{ max-width:540px; margin:0 auto; padding:20px 20px 60px; }

  .section-label{ font-size:14px; font-weight:600; color:var(--wine-deep); margin:20px 0 10px; }
  .section-label:first-child{ margin-top:0; }

  .order-card{
    display:flex; gap:12px; align-items:center; padding:14px 16px; border-radius:14px;
    background:var(--blush); margin-bottom:12px; cursor:pointer; border:1.5px solid transparent;
  }
  .order-card:hover, .order-card:focus-visible{ border-color:var(--wine); outline:none; }
  .order-card .info{ flex:1; }
  .order-card .fabric{ font-weight:700; font-size:15px; color:var(--ink); }
  .order-card .code{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .order-card .status-badge{
    font-size:12px; padding:5px 12px; border-radius:999px; background:var(--wine); color:var(--white); white-space:nowrap;
  }

  .divider{ display:flex; align-items:center; gap:10px; margin:26px 0 18px; color:var(--ink-soft); font-size:13px; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }

  .search-toggle{
    text-align:center; font-size:14px; color:var(--wine); text-decoration:underline; cursor:pointer; margin-bottom:14px;
  }
  .search-box{ display:none; }
  .search-box.open{ display:block; }
  .tab-row{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{
    flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--line); background:var(--white);
    font-size:13.5px; cursor:pointer; color:var(--ink);
  }
  .tab-btn.active{ background:var(--wine); border-color:var(--wine); color:var(--white); font-weight:600; }
  .search-row{ display:flex; gap:10px; margin-bottom:10px; }
  .search-row input{
    flex:1; padding:13px; border-radius:12px; border:1.5px solid var(--line); font-family:inherit; font-size:15px;
  }
  .search-row button{
    padding:0 18px; border-radius:12px; border:none; background:var(--wine); color:var(--white); font-weight:600; cursor:pointer;
  }

  .msg{ text-align:center; color:var(--ink-soft); padding:20px 10px; font-size:14.5px; }

  /* বিস্তারিত ভিউ */
  .detail-view{ display:none; }
  .detail-view.show{ display:block; }
  .back-link{ display:inline-block; margin-bottom:16px; color:var(--wine); font-size:14px; cursor:pointer; }
  .detail-head{ background:var(--blush); border-radius:14px; padding:18px 20px; margin-bottom:20px; }
  .detail-head h2{ font-size:19px; color:var(--wine-deep); margin-bottom:8px; }
  .detail-head .row{ display:flex; justify-content:space-between; font-size:14px; padding:4px 0; color:var(--ink); }
  .detail-head .row span:first-child{ color:var(--ink-soft); }

  .detail-block{ margin-bottom:18px; }
  .detail-block h3{ font-size:14px; color:var(--wine-deep); margin-bottom:8px; }
  .detail-block .content{ background:var(--blush); border-radius:12px; padding:12px 14px; font-size:14px; white-space:pre-line; }

  .stepper{ margin:20px 0; }
  .stepitem{ display:flex; gap:14px; position:relative; padding-bottom:24px; }
  .stepitem:last-child{ padding-bottom:0; }
  .stepitem .dot{
    width:28px; height:28px; border-radius:50%; flex:0 0 28px;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    background:var(--line); color:var(--ink-soft); z-index:1;
  }
  .stepitem.done .dot{ background:var(--wine); color:var(--white); }
  .stepitem.current .dot{ background:var(--gold); color:var(--white); }
  .stepitem:not(:last-child)::before{
    content:''; position:absolute; left:13px; top:28px; bottom:0; width:2px; background:var(--line);
  }
  .stepitem.done:not(:last-child)::before{ background:var(--wine); }
  .steplabel{ padding-top:3px; font-size:14.5px; }
  .steplabel b{ display:block; color:var(--ink); }
  .steplabel span{ color:var(--ink-soft); font-size:12px; }
</style>
</head>
<body>

<header>
  <a href="index.html">←</a>
  <span class="brand-name">অর্ডার ট্র্যাক করুন</span>
</header>

<main>

  <!-- তালিকা ভিউ -->
  <div id="listView">
    <div id="savedOrdersSection" style="display:none;">
      <div class="section-label">আপনার অর্ডার</div>
      <div id="savedOrdersList"></div>
    </div>

    <div class="divider">অথবা</div>

    <div class="tab-row">
      <button class="tab-btn active" id="tabCode" onclick="switchTab('code')">অর্ডার কোড দিয়ে</button>
      <button class="tab-btn" id="tabPhone" onclick="switchTab('phone')">মোবাইল নম্বর দিয়ে</button>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="যেমন: SGD-12345678">
      <button onclick="doSearch()">খুঁজুন</button>
    </div>

    <div id="searchResults"></div>
    <div class="msg" id="msg" style="display:none;"></div>
  </div>

  <!-- বিস্তারিত ভিউ -->
  <div class="detail-view" id="detailView">
    <span class="back-link" onclick="showList()">← তালিকায় ফিরে যান</span>
    <div class="detail-head">
      <h2 id="dFabric"></h2>
      <div class="row"><span>অর্ডার কোড</span><span id="dCode"></span></div>
      <div class="row"><span>ক্যাটাগরি</span><span id="dCategory"></span></div>
      <div class="row"><span>মোট মূল্য</span><span id="dPrice"></span></div>
      <div class="row"><span>পেমেন্ট</span><span id="dPay"></span></div>
    </div>

    <div class="detail-block">
      <h3>মাপ</h3>
      <div class="content" id="dMeasurements"></div>
    </div>

    <div class="detail-block">
      <h3>স্টাইল পছন্দ</h3>
      <div class="content" id="dStyle"></div>
    </div>

    <div class="stepper" id="stepper"></div>
  </div>

</main>

<script>
  const SUPABASE_URL = 'https://dyirxnzbnwmbaoaecgcq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6KCTdCz0orLYFaufqWuNgA_yrTiDU3N';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STATUS_STEPS = [
    { key:'pending',   label:'অর্ডার গৃহীত হয়েছে',   sub:'আপনার মাপ পর্যালোচনা করা হচ্ছে' },
    { key:'confirmed', label:'মাপ কনফার্ম হয়েছে',    sub:'কাপড় প্রস্তুত করা হচ্ছে' },
    { key:'cutting',   label:'কাটিং চলছে',            sub:'দর্জি কাপড় কাটছেন' },
    { key:'sewing',    label:'সেলাই চলছে',            sub:'পোশাক তৈরি হচ্ছে' },
    { key:'ready',     label:'ডেলিভারির জন্য প্রস্তুত', sub:'শীঘ্রই পাঠানো হবে' },
    { key:'delivered', label:'ডেলিভারি সম্পন্ন',       sub:'আপনার পোশাক পৌঁছে গেছে' }
  ];

  let activeTab = 'code';
  let pollTimer = null;

  function switchTab(tab){
    activeTab = tab;
    document.getElementById('tabCode').classList.toggle('active', tab === 'code');
    document.getElementById('tabPhone').classList.toggle('active', tab === 'phone');
    document.getElementById('searchInput').placeholder = tab === 'code' ? 'যেমন: SGD-12345678' : 'যেমন: 01712345678';
  }

  async function loadSavedOrders(){
    let codes = [];
    try{ codes = JSON.parse(localStorage.getItem('sgd_my_orders') || '[]'); }catch(e){}
    if(!codes.length) return;

    const { data } = await sb.from('orders').select('*').in('order_code', codes);
    if(!data || !data.length) return;

    // localStorage-এর ক্রম অনুযায়ী সাজানো (নতুনটা আগে)
    const ordered = codes.map(c => data.find(o => o.order_code === c)).filter(Boolean);

    document.getElementById('savedOrdersSection').style.display = 'block';
    renderCards(ordered, document.getElementById('savedOrdersList'));
  }

  function renderCards(orders, container){
    container.innerHTML = '';
    orders.forEach(o => {
      const statusLabel = STATUS_STEPS.find(s => s.key === o.status)?.label || o.status;
      const card = document.createElement('div');
      card.className = 'order-card';
      card.tabIndex = 0;
      card.innerHTML = `
        <div class="info">
          <div class="fabric">${o.fabric_name}</div>
          <div class="code">${o.order_code}</div>
        </div>
        <span class="status-badge">${statusLabel}</span>`;
      card.onclick = () => showDetail(o);
      card.onkeydown = e => { if(e.key === 'Enter') showDetail(o); };
      container.appendChild(card);
    });
  }

  async function doSearch(){
    const val = document.getElementById('searchInput').value.trim();
    const msg = document.getElementById('msg');
    const resultsBox = document.getElementById('searchResults');
    if(!val) return;

    let query = sb.from('orders').select('*').order('created_at', { ascending: false });
    query = activeTab === 'code' ? query.eq('order_code', val.toUpperCase()) : query.eq('customer_phone', val);

    const { data, error } = await query;
    if(error || !data || !data.length){
      resultsBox.innerHTML = '';
      msg.style.display = 'block';
      msg.textContent = 'কোনো অর্ডার পাওয়া যায়নি। তথ্যটা আবার চেক করুন।';
      return;
    }
    msg.style.display = 'none';
    renderCards(data, resultsBox);
  }

  function showList(){
    if(pollTimer) clearInterval(pollTimer);
    document.getElementById('detailView').classList.remove('show');
    document.getElementById('listView').style.display = 'block';
  }

  function showDetail(order){
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').classList.add('show');
    renderDetail(order);

    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      const { data } = await sb.from('orders').select('*').eq('order_code', order.order_code).maybeSingle();
      if(data) renderDetail(data);
    }, 20000);
  }

  function isImageUrl(val){
    return typeof val === 'string' && /^https?:\/\/.*\.(jpg|jpeg|png|webp)/i.test(val);
  }

  function formatObj(obj, emptyMsg){
    if(!obj || Object.keys(obj).length === 0) return emptyMsg;
    let lines = [];
    for(const key in obj){
      const val = obj[key];
      if(val === null || val === '' || val === undefined) continue;
      lines.push(key + ': ' + val);
    }
    return lines.length ? lines.join('\n') : emptyMsg;
  }

  function renderStyleChoices(obj, emptyMsg){
    if(!obj || Object.keys(obj).length === 0) return `<span>${emptyMsg}</span>`;
    let html = '';
    let hasAny = false;
    for(const key in obj){
      const val = obj[key];
      if(val === null || val === '' || val === undefined) continue;
      hasAny = true;
      if(isImageUrl(val)){
        html += `<div style="margin-bottom:8px;">${key}: <br><img src="${val}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;margin-top:4px;"></div>`;
      }else{
        html += `<div>${key}: ${val}</div>`;
      }
    }
    return hasAny ? html : `<span>${emptyMsg}</span>`;
  }

  function renderDetail(o){
    document.getElementById('dFabric').textContent = o.fabric_name;
    document.getElementById('dCode').textContent = o.order_code;
    document.getElementById('dCategory').textContent = o.category;
    document.getElementById('dPrice').textContent = '৳' + o.total_price;
    document.getElementById('dPay').textContent = o.payment_method === 'bkash' ? 'বিকাশ (অগ্রিম)' : 'ক্যাশ অন ডেলিভারি';
    document.getElementById('dMeasurements').textContent = formatObj(o.measurements, 'কোনো মাপ পাওয়া যায়নি');
    document.getElementById('dStyle').innerHTML = renderStyleChoices(o.style_choices, 'কোনো স্টাইল পছন্দ দেওয়া হয়নি');

    const currentIdx = STATUS_STEPS.findIndex(s => s.key === o.status);
    const stepper = document.getElementById('stepper');
    stepper.innerHTML = STATUS_STEPS.map((s, i) => {
      let cls = '';
      if(i < currentIdx) cls = 'done';
      else if(i === currentIdx) cls = 'current';
      const icon = i < currentIdx ? '✓' : (i + 1);
      return `
        <div class="stepitem ${cls}">
          <div class="dot">${icon}</div>
          <div class="steplabel"><b>${s.label}</b><span>${s.sub}</span></div>
        </div>`;
    }).join('');
  }

  document.getElementById('searchInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') doSearch();
  });

  loadSavedOrders();
</script>
</body>
</html>
